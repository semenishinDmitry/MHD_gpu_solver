name: Benchmark

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  # Optional: uncomment for scheduled runs
  # schedule:
  #   - cron: '0 6 * * 1'

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Ubuntu Clang benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DMHD_NATIVE_ARCH=OFF \
            -DMHD_BUILD_BENCHMARKS=ON \
            -DMHD_BUILD_PYTHON=OFF \
            -DMHD_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j 4 --target mhd_bench mhd_verify
      - name: Run benchmarks
        run: |
          ./build/benchmarks/mhd_bench \
            --benchmark_filter='BM_OrszagTang_Run|BM_Ohmic_OrszagTang64' \
            --benchmark_min_time=0.1s \
            --benchmark_format=json \
            --benchmark_out=benchmark_results.json
          ./build/mhd_verify --build-info | tee build_info.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark_results.json
            build_info.txt
        # Soft signal only — never fail the job on perf noise
        if: always()
